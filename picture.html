<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 互動環繞展廳 (無限輪迴版)</title>
    <style>
      /* 1. 基礎展廳背景設定 */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #111e38 0%, #0a1122 100%);
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 2. 3D 視角景深舞台 */
      .stage-container {
        perspective: 1200px;
        width: 100%;
        height: 65vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        top: -40px;
        z-index: 20; /* 勝過聊天與側欄，確保畫作不被遮擋 */
        pointer-events: none; /* 讓舞台本身不阻擋下層互動（只讓卡片接收事件） */
      }

      /* 3. 3D 畫廊軌道 */
      .gallery-3d {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
        pointer-events: none;
      }

      /* 4. 單一畫作卡片（外層負責 3D 軌道定位） */
      .painting-card {
        position: absolute;
        width: 130px;
        height: 200px;
        transform-style: preserve-3d;
        transition:
          transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 0.6s;
        will-change: transform, opacity;
        pointer-events: auto;
        backface-visibility: hidden;
        /* 確保卡片自身可以接收滑鼠事件，即使父容器 pointer-events: none */
      }

      /* 5. 內層卡片（全卡片解鎖 Hover 放大動畫） */
      .card-inner {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        position: relative;
        cursor: pointer;
        transition:
          transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
          box-shadow 0.3s ease,
          filter 0.3s;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        transform-origin: center center;
        pointer-events: auto;
        backface-visibility: hidden;
      }

      /* [優化] 不管滑鼠移到哪一幅畫，都能觸發精美的放大特效 */
      .card-inner:hover {
        transform: scale(1.18); /* 放大效果 */
        box-shadow: 0 20px 45px rgba(0, 123, 255, 0.45); /* 科技藍發光陰影 */
        filter: brightness(1.2); /* 微微變亮增強互動感 */
        z-index: 1000; /* 確保 hover 時置頂，避免被其他元素遮擋 */
      }

      /* 備援：若滑鼠落在外層 painting-card，內層也啟動同樣效果（避免 transform 導致事件落差） */
      .painting-card:hover .card-inner {
        transform: scale(1.18);
        box-shadow: 0 20px 45px rgba(0, 123, 255, 0.45);
        filter: brightness(1.2);
        z-index: 1000;
      }

      /* 左右箭頭需可操作 */
      .nav-btn {
        pointer-events: auto;
      }

      /* 圖片填滿設定 */
      .painting-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* 畫作名稱文字 */
      .painting-title {
        position: relative;
        z-index: 2;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 12px 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* 6. 左右切換箭頭（磨砂玻璃質感） */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.4);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 100;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transform: translateY(-50%) scale(1.1);
      }

      .prev-btn {
        left: 40px;
      }
      .next-btn {
        right: 40px;
      }

      /* 7. 左下角 AI 聊天機器人視窗 */
      .ai-chat-window {
        position: fixed;
        left: 40px;
        top: 110px;
        width: 360px;
        height: 520px;
        background: rgba(6, 12, 28, 0.98);
        border: 1px solid rgba(72, 133, 255, 0.18);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border-radius: 28px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
        z-index: 70;
        pointer-events: auto;
        overflow: hidden;
      }

      .ai-chat-window.collapsed {
        width: 90px;
        height: 90px;
        min-height: auto;
        padding: 12px;
        border-radius: 22px;
        left: 40px;
        top: auto;
        bottom: 30px;
      }

      .chat-panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .chat-title-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .chat-title {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        line-height: 1.2;
      }

      .chat-subtitle {
        color: rgba(255, 255, 255, 0.65);
        font-size: 12px;
        line-height: 1.5;
      }

      .chat-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #e5f3ff;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        flex-shrink: 0;
      }

      .chat-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }

      .chat-panel-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        padding-right: 8px;
        padding-bottom: 20px; /* 讓最後一個按鈕不會被底部輸入擋住 */
        flex: 1; /* 充滿剩餘空間並可滾動 */
        min-height: 0; /* 使 flex container 的滾動行為穩定 */
      }

      .ai-chat-window.collapsed .chat-panel-body,
      .ai-chat-window.collapsed .reflection-form,
      .ai-chat-window.collapsed .chat-input-area,
      .ai-chat-window.collapsed #options-container {
        display: none;
      }

      .ai-chat-window.collapsed .chat-title,
      .ai-chat-window.collapsed .chat-subtitle {
        opacity: 0;
        visibility: hidden;
      }

      .chat-content {
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
        line-height: 1.7;
        overflow-y: auto;
        min-height: 180px;
        max-height: 320px;
        margin: 0;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 18px;
      }

      .chat-content em {
        color: rgba(255, 255, 255, 0.65);
      }

      .chat-input-area {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-top: 10px;
        flex-shrink: 0; /* 固定高度，不會隨捲動縮起 */
        margin-top: 0;
        background: linear-gradient(
          180deg,
          rgba(6, 12, 28, 0),
          rgba(6, 12, 28, 0.02)
        );
        padding-bottom: 6px;
      }

      .chat-input {
        flex-grow: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 12px 16px;
        color: #fff;
        font-size: 14px;
        outline: none;
        min-height: 44px;
      }

      .chat-input::placeholder {
        color: rgba(255, 255, 255, 0.32);
      }

      .send-btn {
        background: linear-gradient(135deg, #35a3ff, #1b6efb);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 22px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 700;
        transition:
          filter 0.2s,
          transform 0.2s;
        min-width: 90px;
      }

      .send-btn:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      /* 8. 選項按鈕組（首次互動用） */
      .option-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0 4px;
      }

      .option-btn {
        background: rgba(29, 161, 242, 0.16);
        border: 1px solid rgba(29, 161, 242, 0.35);
        color: #d0e9ff;
        padding: 12px 14px;
        border-radius: 16px;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        font-weight: 600;
        min-height: 48px;
      }

      .option-btn:hover {
        background: rgba(29, 161, 242, 0.35);
        transform: translateY(-1px);
      }

      /* 9. 反思保存表單 */
      .reflection-form {
        display: none;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .reflection-form.active {
        display: flex;
      }

      .reflection-input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 12px 14px;
        color: #fff;
        font-size: 13px;
        resize: vertical;
        font-family: inherit;
        min-height: 64px;
      }

      .reflection-label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        font-weight: 600;
      }

      .reflection-input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 10px 12px;
        color: #fff;
        font-size: 12px;
        resize: none;
        font-family: inherit;
      }

      .reflection-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .save-reflection-btn {
        background: #1da1f2;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      .save-reflection-btn:hover {
        background: #1991db;
      }

      /* 10. 反思記錄顯示（可縮合面板） */
      /* 右側反思面板：預設縮合（右下角），點擊展開顯示內容 */
      .voice-of-arts {
        position: fixed;
        right: 30px;
        bottom: 30px;
        top: auto;
        width: 90px;
        height: 90px;
        background: rgba(10, 18, 36, 0.9);
        border: 1px solid rgba(29, 161, 242, 0.3);
        border-radius: 16px;
        padding: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.6);
        z-index: 50;
        transition: all 0.3s ease;
        align-items: center;
        justify-content: center;
      }

      /* open 類別表示展開 */
      .voice-of-arts.open {
        right: 0;
        bottom: auto;
        top: 50%;
        transform: translateY(-50%);
        width: 320px;
        height: auto;
        max-height: 500px;
        border-radius: 24px 0 0 24px;
        padding: 20px;
        overflow-x: hidden;
        overflow-y: auto;
        align-items: flex-start;
        justify-content: flex-start;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .voice-toggle-btn {
        position: relative;
        left: auto;
        top: auto;
        background: rgba(29, 161, 242, 0.8);
        border: none;
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.6);
        z-index: 100;
        flex-shrink: 0;
        order: 0;
      }

      .voice-of-arts.open .voice-toggle-btn {
        margin-right: 12px;
        flex: none;
      }

      .voice-toggle-btn:hover {
        background: #1da1f2;
      }

      .voice-header {
        display: none;
        order: 0;
        width: auto;
      }

      .voice-of-arts.open .voice-header {
        display: block;
        flex: 1;
        order: 0;
      }

      .voice-title {
        color: #1da1f2;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        display: none;
      }

      .voice-of-arts.open .voice-title {
        display: block;
      }

      #voice-records {
        order: 1;
        width: 100%;
      }

      .voice-item {
        color: rgba(255, 255, 255, 0.75);
        font-size: 12px;
        line-height: 1.6;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: none;
      }

      .voice-of-arts.open .voice-item {
        display: block;
      }

      .voice-item:last-child {
        border-bottom: none;
      }

      .voice-label {
        color: rgba(255, 255, 255, 0.5);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* 8. 底部中央說明 */
      .center-welcome {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        z-index: 90;
      }

      .center-welcome h2 {
        font-size: 24px;
        color: #ffffff;
        margin: 0 0 8px 0;
        letter-spacing: 2px;
        font-weight: 700;
      }

      .center-welcome p {
        font-size: 13px;
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
      }
    </style>
  </head>
  <body>
    <button class="nav-btn prev-btn" onclick="changeFocus(-1)">&#10094;</button>
    <button class="nav-btn next-btn" onclick="changeFocus(1)">&#10095;</button>

    <div class="stage-container">
      <div class="gallery-3d" id="gallery">
        <div class="painting-card" onclick="selectPainting('午夜花園')">
          <div class="card-inner">
            <img src="pic/1-1.png" alt="午夜花園" />
            <div class="painting-title">午夜花園</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('晨光夢境')">
          <div class="card-inner">
            <img src="pic/1-2.png" alt="晨光夢境" />
            <div class="painting-title">晨光夢境</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('城市光影')">
          <div class="card-inner">
            <img src="pic/1-3.png" alt="城市光影" />
            <div class="painting-title">城市光影</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('秋日故事')">
          <div class="card-inner">
            <img src="pic/2-1.png" alt="秋日故事" />
            <div class="painting-title">秋日故事</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('海邊奏鳴')">
          <div class="card-inner">
            <img src="pic/2-2.png" alt="海邊奏鳴" />
            <div class="painting-title">海邊奏鳴</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('午後微光')">
          <div class="card-inner">
            <img src="pic/2-3.png" alt="午後微光" />
            <div class="painting-title">午後微光</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-chat-window" id="ai-chat-window">
      <div class="chat-panel-header">
        <div class="chat-title-group">
          <div class="chat-title">AI 慢觀看引導員</div>
          <div class="chat-subtitle">
            點選畫作後，從觀察角度開始你的個人感受之旅。
          </div>
        </div>
        <button
          class="chat-toggle-btn"
          id="chat-panel-toggle"
          onclick="toggleChatPanel()"
        >
          -
        </button>
      </div>

      <div class="chat-panel-body">
        <div class="chat-content" id="chat-box">
          歡迎來到展廳。<br /><br />點選任何一幅畫作，AI 將引導你從「人物 / 色彩
          / 空間 / 情緒」四個角度慢慢看。
        </div>
        <div id="options-container"></div>
        <div class="reflection-form" id="reflection-form">
          <div class="reflection-label">我的觀察與感受</div>
          <textarea
            class="reflection-input"
            id="reflection-thoughts"
            placeholder="這幅作品讓我想到..."
            rows="3"
          ></textarea>
          <textarea
            class="reflection-input"
            id="reflection-feelings"
            placeholder="我感受到..."
            rows="3"
          ></textarea>
          <button class="save-reflection-btn" onclick="saveReflection()">
            保存我的聲音
          </button>
        </div>
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          id="user-input"
          placeholder="繼續與 AI 對話..."
        />
        <button class="send-btn" onclick="sendMessage()">發送</button>
      </div>
    </div>

    <div class="voice-of-arts" id="voice-of-arts">
      <button class="voice-toggle-btn" onclick="toggleVoicePanel()">▶</button>
      <div class="voice-header">
        <div class="voice-title">🎨 My Voice of Arts</div>
      </div>
      <div id="voice-records"></div>
    </div>

    <div class="center-welcome">
      <h2>歡迎來到展廳</h2>
      <p>點擊上方畫作或使用左右箭頭切換</p>
    </div>

    <script {timestamp="2026-06-02" }>
      const cards = document.querySelectorAll(".painting-card");
      const chatBox = document.getElementById("chat-box");
      const optionsContainer = document.getElementById("options-container");
      const reflectionForm = document.getElementById("reflection-form");
      const chatInput = document.getElementById("user-input");
      const aiPanel = document.getElementById("ai-chat-window");
      const chatPanelToggle = document.getElementById("chat-panel-toggle");
      let currentIndex = 2; // 預設聚焦在第 3 幅畫
      let currentPainting = "";
      let reflectionData = null;
      let voiceExpanded = false; // My Voice of Arts 預設收合
      let aiCollapsed = false;

      const observationPrompts = {
        人物: "有趣。<br>你注意到作品中的人物細節。<br><br>他們的姿態、表情或動作帶給你什麼感受？是靜默、躍動、還是某種隱藏的情緒？",
        色彩: "很棒。<br>色彩是引導你目光的關鍵。<br><br>這些色彩讓你感覺溫暖、清新、緊張，還是夢幻？它們彼此之間的對比帶來什麼氛圍？",
        空間: "很棒。<br>你正在觀察畫面的空間結構。<br><br>前景、背景如何引導你的視線？你是否感覺到深度、寬闊，或一種被包裹的氛圍？",
        情緒: "不錯。<br>這是你直接感受作品情緒的時刻。<br><br>這件作品帶給你哪種情緒？你會用什麼詞語來描述它？",
      };

      const artDescriptions = {
        午夜花園:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>這幅作品以深藍與紫色交織出靜謐夜景，如同一座秘密花園。微妙的光影層次讓你感受到沉靜與神祕。</em>",
        晨光夢境:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>溫柔的晨光穿透薄霧，畫面像是從夢中流出的瞬間。光線讓人想起希望與新生。</em>",
        城市光影:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>霓虹與建築線條交錯出城市夜晚的節奏。光影之間帶出城市的熱鬧與孤寂感。</em>",
        秋日故事:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>金黃的季節色彩溫暖而豐富，畫面像一本秋天的故事書，讓人感受溫柔的時光流動。</em>",
        海邊奏鳴:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>海浪節奏在畫面中流動，藍綠色調帶來一種清新與釋放。像是一場輕柔的海邊交響曲。</em>",
        午後微光:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 11px; color: rgba(255,255,255,0.65);'>午後的柔光灑落在靜謐場景，畫面有一種短暫而珍貴的寧靜感。</em>",
      };

      function setChat(message, append = false) {
        if (append) {
          chatBox.innerHTML += `<br><br>${message}`;
        } else {
          chatBox.innerHTML = message;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function updateGallery() {
        cards.forEach((card, index) => {
          let diff = index - currentIndex;
          if (diff < -3) diff += cards.length;
          if (diff > 2) diff -= cards.length;

          const translateX = diff * 220;
          const rotateY = diff * -25;
          const translateZ = -Math.abs(diff) * 70;

          card.style.transform = `translateX(${translateX}px) rotateY(${rotateY}deg) translateZ(${translateZ}px)`;
          card.style.pointerEvents = "auto";
          card.style.opacity =
            diff === 0 ? "1" : Math.max(0.4, 1 - Math.abs(diff) * 0.22);
          card.style.zIndex =
            diff === 0 ? "15" : (10 - Math.abs(diff)).toString();
        });
      }

      function changeFocus(direction) {
        currentIndex = (currentIndex + direction + cards.length) % cards.length;
        updateGallery();
      }

      function toggleVoicePanel() {
        const panel = document.getElementById("voice-of-arts");
        const btn = panel.querySelector(".voice-toggle-btn");
        voiceExpanded = !voiceExpanded;
        if (voiceExpanded) {
          panel.classList.add("open");
          btn.textContent = "◀";
        } else {
          panel.classList.remove("open");
          btn.textContent = "▶";
        }
      }

      function toggleChatPanel() {
        aiCollapsed = !aiCollapsed;
        if (aiCollapsed) {
          aiPanel.classList.add("collapsed");
          chatPanelToggle.textContent = "+";
        } else {
          aiPanel.classList.remove("collapsed");
          chatPanelToggle.textContent = "-";
        }
      }

      function selectPainting(name) {
        const selectedIndex = Array.from(cards).findIndex((card) => {
          return card.querySelector(".painting-title").innerText === name;
        });
        if (selectedIndex >= 0) {
          currentIndex = selectedIndex;
          updateGallery();
        }

        currentPainting = name;
        reflectionData = {
          artwork: name,
          observation: "",
          thoughts: "",
          feelings: "",
        };

        setChat(
          `<strong>AI 慢觀看引導員</strong><br>你正在欣賞 <strong>【${name}】</strong>。<br><br>請從下面的觀察方向中選一項，讓我們慢慢看這件作品。`,
          false,
        );
        renderObservationOptions();
        reflectionForm.classList.remove("active");
      }

      function renderObservationOptions() {
        optionsContainer.innerHTML = `
          <div class="option-buttons">
            <button class="option-btn" onclick="selectObservation('人物')">人物</button>
            <button class="option-btn" onclick="selectObservation('色彩')">色彩</button>
            <button class="option-btn" onclick="selectObservation('空間')">空間</button>
            <button class="option-btn" onclick="selectObservation('情緒')">情緒</button>
          </div>
        `;
      }

      function selectObservation(aspect) {
        if (!currentPainting) return;

        reflectionData.observation = aspect;
        optionsContainer.innerHTML = "";

        const prompt = observationPrompts[aspect] || "請選擇一個觀察方向。";
        const description = artDescriptions[currentPainting] || "";

        setChat(`${prompt}${description}`, true);
        showReflectionForm();
      }

      function showReflectionForm() {
        reflectionForm.classList.add("active");
      }

      function saveReflection() {
        const thoughts = document
          .getElementById("reflection-thoughts")
          .value.trim();
        const feelings = document
          .getElementById("reflection-feelings")
          .value.trim();
        if (!thoughts || !feelings) {
          alert("請填寫你的觀察與感受，才能保存你的聲音。");
          return;
        }

        reflectionData.thoughts = thoughts;
        reflectionData.feelings = feelings;
        addVoiceRecord(reflectionData);

        document.getElementById("reflection-thoughts").value = "";
        document.getElementById("reflection-feelings").value = "";
        reflectionForm.classList.remove("active");

        setChat(
          `✓ 你的聲音已保存。<br>你也可以繼續選擇其他作品，或在右側查看你的 My Voice of Arts。`,
          true,
        );
      }

      function addVoiceRecord(data) {
        const voiceOfArts = document.getElementById("voice-of-arts");
        const voiceRecords = document.getElementById("voice-records");
        const today = new Date().toLocaleDateString("zh-TW");

        const recordHTML = `
          <div class="voice-item">
            <div class="voice-label">${today}</div>
            <strong style="color: #fff;">${data.artwork}</strong>
          </div>
          <div class="voice-item">
            <div class="voice-label">我的想法</div>
            ${data.thoughts}
          </div>
          <div class="voice-item">
            <div class="voice-label">我的感受</div>
            ${data.feelings}
          </div>
          <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0;"></div>
        `;
        voiceRecords.innerHTML += recordHTML;
        // 不自動展開，讓用戶自己決定何時查看
      }

      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        setChat(`<strong>你：</strong><br>${text}`, true);
        chatInput.value = "";

        // 模擬 AI 回應（延遲 800ms）
        const aiResponses = [
          "這是一個有趣的觀察。能告訴我更多你對這幅作品的想法嗎？",
          "我注意到你提到了這一點。這是作品傳達給你的核心情感嗎？",
          "很深入的思考。你覺得這與你之前的藝術體驗有什麼不同？",
          "這是一個獨特的視角。還有其他方面你想探索的嗎？",
          "你的感受很真摯。想不想進一步深化這個觀察？",
        ];
        const randomResponse =
          aiResponses[Math.floor(Math.random() * aiResponses.length)];

        setTimeout(() => {
          setChat(`<strong>慢觀看引導員：</strong><br>${randomResponse}`, true);
        }, 800);
      }

      window.onload = function () {
        updateGallery();
        setChat(
          `歡迎來到展廳。<br><br>請點選任何一幅畫作，AI 將引導你從「人物 / 色彩 / 空間 / 情緒」四個角度慢慢看。`,
        );
      };
    </script>
  </body>
</html>
