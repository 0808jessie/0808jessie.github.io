<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 互動環繞展廳</title>
    <style>
      /* 1. 基礎展廳背景設定 */
      body {
        margin: 0;
        padding: 0;
        /* 使用 artbg 圖片作為背景，若不存在請放入 pic/artbg.jpg */
        background-image:
          linear-gradient(rgba(6, 12, 28, 0.6), rgba(6, 12, 28, 0.6)),
          url("pic/art.jpg");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 2. 3D 視角景深舞台 */
      .stage-container {
        perspective: 1200px;
        width: 100%;
        height: 65vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        top: -40px;
        z-index: 20; /* 勝過聊天與側欄，確保畫作不被遮擋 */
        pointer-events: none; /* 讓舞台本身不阻擋下層互動（只讓卡片接收事件） */
      }

      /* 3. 3D 畫廊軌道 */
      .gallery-3d {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
        pointer-events: none;
      }

      /* 4. 單一畫作卡片（外層負責 3D 軌道定位） */
      .painting-card {
        position: absolute;
        width: 130px;
        height: 200px;
        transform-style: preserve-3d;
        transition:
          transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 0.6s;
        will-change: transform, opacity;
        pointer-events: auto;
        backface-visibility: hidden;
        /* 確保卡片自身可以接收滑鼠事件，即使父容器 pointer-events: none */
      }

      /* 橫式（Landscape）卡片：用於市井風情與南管樂奏 */
      .painting-card.landscape {
        width: 250px;
        height: 100px;
      }

      /* 5. 內層卡片（全卡片解鎖 Hover 放大動畫） */
      .card-inner {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        position: relative;
        cursor: pointer;
        transition:
          transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
          box-shadow 0.3s ease,
          filter 0.3s;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        transform-origin: center center;
        pointer-events: auto;
        backface-visibility: hidden;
      }

      /* [優化] 不管滑鼠移到哪一幅畫，都能觸發精美的放大特效 */
      .card-inner:hover {
        transform: scale(1.18); /* 放大效果 */
        box-shadow: 0 20px 45px rgba(223, 102, 21, 0.648); /* 科技藍發光陰影 */
        filter: brightness(1.2); /* 微微變亮增強互動感 */
        z-index: 1000; /* 確保 hover 時置頂，避免被其他元素遮擋 */
      }

      /* 備援：若滑鼠落在外層 painting-card，內層也啟動同樣效果（避免 transform 導致事件落差） */
      .painting-card:hover .card-inner {
        transform: scale(1.18);
        box-shadow: 0 20px 45px rgba(223, 102, 21, 0.648);
        filter: brightness(1.2);
        z-index: 1000;
      }

      /* 左右箭頭需可操作 */
      .nav-btn {
        pointer-events: auto;
      }

      /* 圖片填滿設定 */
      .painting-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* 橫式卡片圖片完整顯示 */
      .painting-card.landscape img {
        object-fit: contain;
        /*background: rgba(0, 0, 0, 0.2);*/
      }

      /* 畫作名稱文字 */
      .painting-title {
        position: relative;
        z-index: 2;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 12px 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* 6. 左右切換箭頭（磨砂玻璃質感） */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.4);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 100;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        transform: translateY(-50%) scale(1.1);
      }

      .prev-btn {
        left: 40px;
      }
      .next-btn {
        right: 40px;
      }

      /* 7. 左下角 AI 聊天機器人視窗 */
      .ai-chat-window {
        position: fixed;
        left: 40px;
        top: 110px;
        width: 360px;
        height: 520px;
        background: rgba(255, 141, 131, 0.4);
        border: 1px solid rgba(255, 141, 131, 0.667);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border-radius: 28px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
        z-index: 70;
        pointer-events: auto;
        overflow: hidden;
      }

      .ai-chat-window.collapsed {
        width: 90px;
        height: 40px;
        min-height: auto;
        padding: 12px;
        border-radius: 22px;
        left: 40px;
        top: auto;
        bottom: 30px;
      }

      .chat-panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .chat-title-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .chat-title {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        line-height: 1.2;
      }

      .chat-subtitle {
        color: rgba(255, 255, 255, 0.65);
        font-size: 14px;
        line-height: 1.5;
      }

      .chat-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #ffffff;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        flex-shrink: 0;
      }

      .chat-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(1px);
      }

      .chat-panel-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        padding-right: 8px;
        padding-bottom: 20px; /* 讓最後一個按鈕不會被底部輸入擋住 */
        flex: 1; /* 充滿剩餘空間並可滾動 */
        min-height: 0; /* 使 flex container 的滾動行為穩定 */
      }

      .ai-chat-window.collapsed .chat-panel-body,
      .ai-chat-window.collapsed .reflection-form,
      .ai-chat-window.collapsed .chat-input-area,
      .ai-chat-window.collapsed #options-container {
        display: none;
      }

      .ai-chat-window.collapsed .chat-title,
      .ai-chat-window.collapsed .chat-subtitle {
        opacity: 0;
        visibility: hidden;
      }

      .chat-content {
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
        line-height: 1.7;
        overflow-y: auto;
        min-height: 180px;
        max-height: 320px;
        margin: 0;
        background: rgba(203, 96, 96, 0.495);
        border: 1px solid rgba(203, 96, 96, 0.71);
        border-radius: 18px;
        padding: 18px;
      }

      .chat-content em {
        color: rgba(203, 96, 96, 0.895);
      }

      .chat-input-area {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-top: 10px;
        flex-shrink: 0; /* 固定高度，不會隨捲動縮起 */
        margin-top: 0;
        background: linear-gradient(
          180deg,
          rgba(6, 12, 28, 0),
          rgba(6, 12, 28, 0.02)
        );
        padding-bottom: 6px;
      }

      .chat-input {
        flex-grow: 1;
        background: rgba(155, 87, 87, 0.895);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 12px 16px;
        color: #fff;
        font-size: 14px;
        outline: none;
        min-height: 20px;
      }

      .chat-input::placeholder {
        color: rgba(255, 255, 255, 0.32);
      }

      .send-btn {
        background: linear-gradient(135deg, #dc8623, #dda25e);
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 22px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 700;
        transition:
          filter 0.2s,
          transform 0.2s;
        min-width: 90px;
      }

      .send-btn:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      /* 8. 選項按鈕組（首次互動用） */
      .option-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0 4px;
      }

      .option-btn {
        background: rgba(245, 197, 94, 0.616);
        border: 1px solid rgba(245, 197, 94, 0.616);
        color: #f8c4ad;
        padding: 12px 14px;
        border-radius: 16px;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        font-weight: 600;
        min-height: 48px;
      }

      .option-btn:hover {
        background: #f8c4ad81;
        transform: translateY(1px);
      }

      /* 9. 反思保存表單 */
      .reflection-form {
        display: none;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .reflection-form.active {
        display: flex;
      }

      .reflection-input {
        background: rgba(245, 175, 175, 0.539);
        border: 1px solid rgba(245, 175, 175, 0.836);
        border-radius: 16px;
        padding: 12px 14px;
        color: #fff;
        font-size: 13px;
        resize: vertical;
        font-family: inherit;
        min-height: 64px;
      }

      .reflection-label {
        color: rgba(245, 175, 175, 0.836);
        font-size: 12px;
        font-weight: 600;
      }

      .reflection-input {
        background: rgba(224, 153, 153, 0.616);
        border: 1px solid rgba(245, 175, 175, 0.836);
        border-radius: 12px;
        padding: 10px 12px;
        color: #fff;
        font-size: 12px;
        resize: none;
        font-family: inherit;
      }

      .reflection-input::placeholder {
        color: rgb(255, 255, 255);
      }

      .save-reflection-btn {
        background: #dc8623;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      .save-reflection-btn:hover {
        background: #dc6142;
      }

      /* 10. 反思記錄顯示（可縮合面板） */
      /* 右側反思面板：預設縮合（右下角），點擊展開顯示內容 */
      .voice-of-arts {
        position: fixed;
        right: 40px;
        bottom: 30px;
        top: auto;
        width: 90px;
        height: 40px;
        background: rgba(255, 141, 131, 0.4);
        border: 1px solid rgba(255, 141, 131, 0.667);
        border-radius: 16px;
        padding: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.6);
        z-index: 50;
        transition: all 0.3s ease;
        align-items: center;
        justify-content: center;
      }

      /* open 類別表示展開 */
      .voice-of-arts.open {
        right: 40px; /* 與 AI 面板對稱 */
        bottom: auto;
        top: 110px; /* 與 AI 面板同高度位置 */
        transform: none;
        width: 360px; /* 與 AI 面板相同 */
        height: 520px; /* 與 AI 面板相同 */
        max-height: 520px;
        border-radius: 28px;
        padding: 18px;
        overflow: hidden; /* 外層隱藏，內層捲動 */
        align-items: flex-start;
        justify-content: flex-start;
        display: flex;
        flex-direction: column;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
      }

      .voice-toggle-btn {
        position: relative;
        left: auto;
        top: auto;
        background: rgba(248, 158, 62, 0.8);
        border: none;
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        box-shadow: 0 8px 18px rgba(235, 162, 113, 0.6);
        z-index: 50;
        flex-shrink: 0;
        order: 0;
      }

      .voice-of-arts.open .voice-toggle-btn {
        margin-right: 12px;
        flex: none;
      }

      .voice-toggle-btn:hover {
        background: rgba(248, 158, 62, 0.8);
      }

      .voice-header {
        display: none;
        order: 0;
        width: auto;
      }

      .voice-of-arts.open .voice-header {
        display: block;
        flex: 1;
        order: 0;
      }

      .voice-title {
        color: #ed721b;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        display: none;
      }

      .voice-of-arts.open .voice-title {
        display: block;
      }

      #voice-records {
        order: 1;
        width: 100%;
        overflow-y: auto; /* 讓記錄區可捲動 */
        flex: 1 1 auto;
        padding-right: 8px;
      }

      .voice-item {
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        line-height: 1.6;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: none;
      }

      .voice-of-arts.open .voice-item {
        display: block;
      }

      .voice-item:last-child {
        border-bottom: none;
      }

      .voice-label {
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* 8. 底部中央說明 */
      .center-welcome {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        z-index: 90;
      }

      .center-welcome h2 {
        font-size: 24px;
        color: #ffffff;
        margin: 0 0 8px 0;
        letter-spacing: 2px;
        font-weight: 700;
      }

      .center-welcome p {
        font-size: 24px;
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
      }
    </style>
  </head>
  <body>
    <button class="nav-btn prev-btn" onclick="changeFocus(-1)">&#10094;</button>
    <button class="nav-btn next-btn" onclick="changeFocus(1)">&#10095;</button>

    <div class="stage-container">
      <div class="gallery-3d" id="gallery">
        <div class="painting-card" onclick="selectPainting('紅沙發上的裸女')">
          <div class="card-inner">
            <img src="pic/ait (1).png" alt="紅沙發上的裸女" />
            <div class="painting-title">紅沙發上的裸女</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('拉小提琴的女子')">
          <div class="card-inner">
            <img src="pic/ait (2).png" alt="拉小提琴的女子" />
            <div class="painting-title">拉小提琴的女子</div>
          </div>
        </div>
        <div
          class="painting-card landscape"
          onclick="selectPainting('市井風情')"
        >
          <div class="card-inner">
            <img src="pic/ait (5).png" alt="市井風情" />
            <div class="painting-title">市井風情</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('夜與裸女')">
          <div class="card-inner">
            <img src="pic/ait (3).png" alt="夜與裸女" />
            <div class="painting-title">夜與裸女</div>
          </div>
        </div>
        <div class="painting-card" onclick="selectPainting('散步')">
          <div class="card-inner">
            <img src="pic/ait (4).png" alt="散步" />
            <div class="painting-title">散步</div>
          </div>
        </div>

        <div
          class="painting-card landscape"
          onclick="selectPainting('南管樂奏')"
        >
          <div class="card-inner">
            <img src="pic/ait (6).png" alt="南管樂奏" />
            <div class="painting-title">南管樂奏</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-chat-window" id="ai-chat-window">
      <div class="chat-panel-header">
        <div class="chat-title-group">
          <div class="chat-title">AI 觀看引導員</div>
          <div class="chat-subtitle">
            點選畫作後，從觀察角度開始你的個人感受之旅。
          </div>
        </div>
        <button
          class="chat-toggle-btn"
          id="chat-panel-toggle"
          onclick="toggleChatPanel()"
        >
          -
        </button>
      </div>

      <div class="chat-panel-body">
        <div class="chat-content" id="chat-box">
          歡迎來到展廳。<br /><br />點選任何一幅畫作，AI 將引導你從「人物 / 色彩
          / 空間 / 情緒」四個角度慢慢看。
        </div>
        <div id="options-container"></div>
        <div class="reflection-form" id="reflection-form">
          <div class="reflection-label">我的觀察與感受</div>
          <textarea
            class="reflection-input"
            id="reflection-thoughts"
            placeholder="這幅作品讓我想到..."
            rows="3"
          ></textarea>
          <textarea
            class="reflection-input"
            id="reflection-feelings"
            placeholder="我感受到..."
            rows="3"
          ></textarea>
          <button class="save-reflection-btn" onclick="saveReflection()">
            保存我的聲音
          </button>
        </div>
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          id="user-input"
          placeholder="繼續與 AI 對話..."
        />
        <button class="send-btn" onclick="sendMessage()">發送</button>
      </div>
    </div>

    <div class="voice-of-arts" id="voice-of-arts">
      <button class="voice-toggle-btn" onclick="toggleVoicePanel()">▶</button>
      <div class="voice-header">
        <div class="voice-title">🎨 My Voice of Arts</div>
      </div>
      <div id="voice-records"></div>
    </div>

    <div class="center-welcome">
      <h2>歡迎來到展廳</h2>
      <p>點擊畫作或使用左右箭頭切換</p>
    </div>

    <script {timestamp="2026-06-02" }>
      const cards = document.querySelectorAll(".painting-card");
      const chatBox = document.getElementById("chat-box");
      const optionsContainer = document.getElementById("options-container");
      const reflectionForm = document.getElementById("reflection-form");
      const chatInput = document.getElementById("user-input");
      const aiPanel = document.getElementById("ai-chat-window");
      const chatPanelToggle = document.getElementById("chat-panel-toggle");
      let currentIndex = 2; // 預設聚焦在第 3 幅畫
      let currentPainting = "";
      let reflectionData = null;
      let voiceExpanded = false; // My Voice of Arts 預設收合
      let aiCollapsed = false;

      const observationPrompts = {
        人物: "有趣。<br>你注意到作品中的人物細節。<br><br>他們的姿態、表情或動作帶給你什麼感受？是靜默、躍動、還是某種隱藏的情緒？",
        色彩: "很棒。<br>色彩是引導你目光的關鍵。<br><br>這些色彩讓你感覺溫暖、清新、緊張，還是夢幻？它們彼此之間的對比帶來什麼氛圍？",
        空間: "很棒。<br>你正在觀察畫面的空間結構。<br><br>前景、背景如何引導你的視線？你是否感覺到深度、寬闊，或一種被包裹的氛圍？",
        情緒: "不錯。<br>這是你直接感受作品情緒的時刻。<br><br>這件作品帶給你哪種情緒？你會用什麼詞語來描述它？",
      };

      const artDescriptions = {
        紅沙發上的裸女:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>這是梁奕焚最具代表性的「黑美人」系列作品之一。畫中女子身軀塗黑，僅以細膩的白線勾勒出五官與豐腴的身體輪廓。她優雅地坐在搶眼的朱紅色大沙發上，下半身圍著帶有白色花朵與綠葉的土黃色草裙，背景則是明亮的綠色植物圖騰，展現出強烈的色彩對比與原始、純粹的女性生命力。</em>",
        拉小提琴的女子:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>同樣屬於黑美人系列，畫中女子穿著一件清新藍底、白色花卉圖案的洋裝，坐在紅色木椅上專注地拉著小提琴。背景由溫暖的橙褐色與黑色線條構成繁複的古典花卉壁紙，整幅畫將西方的古典樂器與東方內斂、平面的裝飾美學完美融合，充滿和諧的律動感。</em>",
        夜與裸女:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>此作營造出浪漫而神祕的夜間氛圍。一名黑色裸女姿態慵懶地躺在鋪有精緻地毯的地面上，雙腿微微抬起搭在椅子旁。最引人注目的是佔據畫面上半部的大片黑色背景，上面點綴著無數細碎的粉、白、綠色點塊，宛如夜空中繁星點點，又似飄落的滿天花雨，充滿詩意與夢幻色彩。</em>",
        散步: "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>這是梁奕焚 2023 年較近期的作品，風格更趨向童趣與純樸的素描感。畫面採取黑色背景，主角是一位頭戴藍色頭巾、身穿綠色長袍的側面女子，她身旁伴隨著一隻線條簡單、神情帶點呆萌的白色小狗。人物面部保留了木質般的紋理質感，展現出返璞歸真的藝術趣味。</em>",
        市井風情:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>這是一幅橫幅的大型創作，背景是一貫熱烈的梁氏朱紅色。畫面由左至右描繪了台灣早期社會或傳統市井中的手工藝職人：修傘匠、製鞋匠、在貨架旁休憩的女子，以及右側手拿風車的攤販。作品帶有濃厚的鄉土情懷與民俗色彩，記錄了舊時代日常生活的靜謐與質樸。</em>",
        南管樂奏:
          "<br><br>─ 關於作品 ─<br><em style='font-size: 14px; color: rgba(255,255,255,0.65);'>這幅同樣是經典的紅色橫幅大作，主題聚焦於台灣傳統音樂「南管」的演奏場景。四位樂師各持不同的傳統樂器（如琵琶、三弦、月琴等）專注彈奏，每個人身上的服飾花紋（黃底碎花、藍底白花、黑底紫袖等）都經過精心的裝飾性設計。畫家巧妙地運用色塊與線條，將傳統音樂的優雅視覺化，散發出優雅的古典台味。</em>",
      };

      function setChat(message, append = false) {
        if (append) {
          chatBox.innerHTML += `<br><br>${message}`;
        } else {
          chatBox.innerHTML = message;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function updateGallery() {
        cards.forEach((card, index) => {
          let diff = index - currentIndex;
          if (diff < -3) diff += cards.length;
          if (diff > 2) diff -= cards.length;

          const translateX = diff * 220;
          const rotateY = diff * -25;
          const translateZ = -Math.abs(diff) * 70;

          card.style.transform = `translateX(${translateX}px) rotateY(${rotateY}deg) translateZ(${translateZ}px)`;
          card.style.pointerEvents = "auto";
          card.style.opacity =
            diff === 0 ? "1" : Math.max(0.4, 1 - Math.abs(diff) * 0.22);
          card.style.zIndex =
            diff === 0 ? "15" : (10 - Math.abs(diff)).toString();
        });
      }

      function changeFocus(direction) {
        currentIndex = (currentIndex + direction + cards.length) % cards.length;
        updateGallery();
      }

      function toggleVoicePanel() {
        const panel = document.getElementById("voice-of-arts");
        const btn = panel.querySelector(".voice-toggle-btn");
        voiceExpanded = !voiceExpanded;
        if (voiceExpanded) {
          panel.classList.add("open");
          btn.textContent = "◀";
        } else {
          panel.classList.remove("open");
          btn.textContent = "▶";
        }
      }

      function toggleChatPanel() {
        aiCollapsed = !aiCollapsed;
        if (aiCollapsed) {
          aiPanel.classList.add("collapsed");
          chatPanelToggle.textContent = "+";
        } else {
          aiPanel.classList.remove("collapsed");
          chatPanelToggle.textContent = "-";
        }
      }

      function selectPainting(name) {
        const selectedIndex = Array.from(cards).findIndex((card) => {
          return card.querySelector(".painting-title").innerText === name;
        });
        if (selectedIndex >= 0) {
          currentIndex = selectedIndex;
          updateGallery();
        }

        currentPainting = name;
        reflectionData = {
          artwork: name,
          observation: "",
          thoughts: "",
          feelings: "",
        };

        setChat(
          `<strong>AI 慢觀看引導員</strong><br>你正在欣賞 <strong>【${name}】</strong>。<br><br>請從下面的觀察方向中選一項，讓我們慢慢看這件作品。`,
          false,
        );
        renderObservationOptions();
        reflectionForm.classList.remove("active");
      }

      function renderObservationOptions() {
        optionsContainer.innerHTML = `
          <div class="option-buttons">
            <button class="option-btn" onclick="selectObservation('人物')">人物</button>
            <button class="option-btn" onclick="selectObservation('色彩')">色彩</button>
            <button class="option-btn" onclick="selectObservation('空間')">空間</button>
            <button class="option-btn" onclick="selectObservation('情緒')">情緒</button>
          </div>
        `;
      }

      function selectObservation(aspect) {
        if (!currentPainting) return;

        reflectionData.observation = aspect;
        optionsContainer.innerHTML = "";

        const prompt = observationPrompts[aspect] || "請選擇一個觀察方向。";
        const description = artDescriptions[currentPainting] || "";

        setChat(`${prompt}${description}`, true);
        showReflectionForm();
      }

      function showReflectionForm() {
        reflectionForm.classList.add("active");
      }

      function saveReflection() {
        const thoughts = document
          .getElementById("reflection-thoughts")
          .value.trim();
        const feelings = document
          .getElementById("reflection-feelings")
          .value.trim();
        if (!thoughts || !feelings) {
          alert("請填寫你的觀察與感受，才能保存你的聲音。");
          return;
        }

        reflectionData.thoughts = thoughts;
        reflectionData.feelings = feelings;
        addVoiceRecord(reflectionData);

        document.getElementById("reflection-thoughts").value = "";
        document.getElementById("reflection-feelings").value = "";
        reflectionForm.classList.remove("active");

        setChat(
          `✓ 你的聲音已保存。<br>你也可以繼續選擇其他作品，或在右側查看你的 My Voice of Arts。`,
          true,
        );
      }

      function addVoiceRecord(data) {
        const voiceOfArts = document.getElementById("voice-of-arts");
        const voiceRecords = document.getElementById("voice-records");
        const today = new Date().toLocaleDateString("zh-TW");

        const recordHTML = `
          <div class="voice-item">
            <div class="voice-label">${today}</div>
            <strong style="color: #fff;">${data.artwork}</strong>
          </div>
          <div class="voice-item">
            <div class="voice-label">我的想法</div>
            ${data.thoughts}
          </div>
          <div class="voice-item">
            <div class="voice-label">我的感受</div>
            ${data.feelings}
          </div>
          <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0;"></div>
        `;
        voiceRecords.innerHTML += recordHTML;
        // 不自動展開，讓用戶自己決定何時查看
      }

      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        setChat(`<strong>你：</strong><br>${text}`, true);
        chatInput.value = "";

        // 模擬 AI 回應（延遲 800ms）
        const aiResponses = [
          "這是一個有趣的觀察。能告訴我更多你對這幅作品的想法嗎？",
          "我注意到你提到了這一點。這是作品傳達給你的核心情感嗎？",
          "很深入的思考。你覺得這與你之前的藝術體驗有什麼不同？",
          "這是一個獨特的視角。還有其他方面你想探索的嗎？",
          "你的感受很真摯。想不想進一步深化這個觀察？",
        ];
        const randomResponse =
          aiResponses[Math.floor(Math.random() * aiResponses.length)];

        setTimeout(() => {
          setChat(`<strong>慢觀看引導員：</strong><br>${randomResponse}`, true);
        }, 800);
      }

      window.onload = function () {
        updateGallery();
        setChat(
          `歡迎來到展廳。<br><br>請點選任何一幅畫作，AI 將引導你從「人物 / 色彩 / 空間 / 情緒」四個角度慢慢看。`,
        );
      };
    </script>
  </body>
</html>
